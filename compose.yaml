name: remotehand

x-dev-service: &dev-service
  build:
    context: .
    target: dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - go-mod-cache:/home/remotehand/go/pkg/mod
    - go-build-cache:/home/remotehand/.cache/go-build

services:
  dev:
    <<: *dev-service

  server:
    build:
      context: .
      target: server
    environment:
      REMOTEHAND_INPUT_MODE: mock
      REMOTEHAND_PAIR_FILE: /run/pair/token
    tmpfs:
      - /run/pair:uid=1000,gid=1000,mode=0700
    ports:
      - "0.0.0.0:18080:18080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  build-windows:
    <<: *dev-service
    environment:
      REMOTEHAND_VERSION: ${REMOTEHAND_VERSION:-v0.1.0-rc.1}
    command:
      - sh
      - -c
      - >-
        mkdir -p dist &&
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64
        go build -trimpath -ldflags="-s -w -X main.version=$$REMOTEHAND_VERSION" -o dist/remotehand.exe ./cmd/remotehand &&
        cd dist &&
        zip -j -X -q Remotehand-windows-amd64.zip remotehand.exe ../README.md &&
        sha256sum remotehand.exe Remotehand-windows-amd64.zip > SHA256SUMS

volumes:
  go-mod-cache:
  go-build-cache:
