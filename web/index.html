<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Remotehand</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Remotehand</p>
          <h1>Тачпад</h1>
        </div>
        <span id="status" class="status" aria-live="polite">Подключение…</span>
      </header>

      <div id="pad">Ведите пальцем для движения курсора.<br>Коснитесь для левого клика.</div>
      <div class="key-row mouse-buttons">
        <button type="button" data-button="left" disabled>Левый клик</button>
        <button type="button" data-button="right" disabled>Правый клик</button>
      </div>
      <form id="text-form">
        <label for="text-input">Текст для активного окна Windows</label>
        <textarea
          id="text-input"
          rows="6"
          inputmode="text"
          autocomplete="off"
          autocapitalize="sentences"
          placeholder="Коснитесь поля — откроется клавиатура телефона"
        ></textarea>
        <p id="message" class="message" aria-live="polite"></p>
        <button id="send-text" class="primary" type="submit" disabled>Отправить текст</button>
      </form>

      <section aria-label="Служебные клавиши">
        <h2>Клавиши</h2>
        <div class="key-row">
          <button type="button" data-key="backspace" disabled>⌫ Backspace</button>
          <button type="button" data-key="enter" disabled>↵ Enter</button>
          <button type="button" data-key="escape" disabled>Esc</button>
        </div>
      </section>
      <section aria-label="Громкость">
        <h2>Громкость <output id="level">—</output></h2>
        <div class="key-row">
          <button type="button" data-volume="-5" disabled>−5%</button>
          <button type="button" data-volume="5" disabled>+5%</button>
          <button type="button" id="mute" disabled>Без звука</button>
        </div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
